openapi: 3.0.3
info:
  title: Social Course API
  version: 1.0.0
  description: 'REST API серверной части веб-приложения «Социальная сеть»: пользователи,
    профили, публикации, подписки, комментарии, реакции, закладки, уведомления и личные
    сообщения.'
  contact:
    name: Червов Никита Александрович
  license:
    name: Course project
paths:
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      summary: Удалить текущий token
      tags:
      - Auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: Token удален.
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      summary: Текущий пользователь
      tags:
      - Auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
          description: ''
    patch:
      operationId: v1_auth_me_partial_update
      summary: Обновить текущего пользователя и профиль
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserMeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserMeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserMeRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description: Создает пользователя, профиль и возвращает token для авторизации
        в API.
      summary: Регистрация пользователя
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              НовыйПользователь:
                value:
                  username: student
                  password: StrongPassword123
                  email: student@example.com
                  first_name: Никита
                  last_name: Червов
                summary: Новый пользователь
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: v1_auth_token_create
      description: 'Возвращает token по username и password. Для Postman используйте
        Authorization: Token <token>.'
      summary: Получить token
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
            examples:
              Демо-пользователь:
                value:
                  username: alice
                  password: password123
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
