          type: boolean
          readOnly: true
        user_reaction:
          type: string
          nullable: true
          readOnly: true
        is_bookmarked:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
