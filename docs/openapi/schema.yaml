    ProfileRequest:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 80
        bio:
          type: string
          maxLength: 500
        location:
          type: string
          maxLength: 120
        website:
          type: string
          format: uri
          maxLength: 200
        avatar_url:
          type: string
          format: uri
          maxLength: 200
        birth_date:
          type: string
          format: date
          nullable: true
        is_private:
          type: boolean
    Reaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        post:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/UserPublic'
          readOnly: true
        kind:
          $ref: '#/components/schemas/KindEnum'
        created_at:
          type: string
          format: date-time
