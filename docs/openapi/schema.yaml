components:
  schemas:
    AuthTokenRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
          title: Имя пользователя
        password:
          type: string
          writeOnly: true
          minLength: 1
          title: Пароль
      required:
      - password
      - username
    BlockedUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        blocker:
          allOf:
          - $ref: '#/components/schemas/UserPublic'
          readOnly: true
        blocked:
          allOf:
          - $ref: '#/components/schemas/UserPublic'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - blocked
      - blocker
      - created_at
      - id
    Bookmark:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        post:
          allOf:
          - $ref: '#/components/schemas/Post'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - post
    BookmarkResult:
      type: object
      properties:
        active:
          type: boolean
        bookmark_id:
          type: integer
          nullable: true
      required:
      - active
      - bookmark_id
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        post:
          type: integer
        author:
          allOf:
          - $ref: '#/components/schemas/UserPublic'
          readOnly: true
        parent:
          type: integer
          nullable: true
        content:
          type: string
          maxLength: 2000
        is_deleted:
          type: boolean
          readOnly: true
        replies:
          type: array
          items:
            $ref: '#/components/schemas/CommentShort'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - content
      - created_at
      - id
      - is_deleted
      - post
      - replies
      - updated_at
    CommentRequest:
      type: object
      properties:
        post:
          type: integer
        parent:
          type: integer
          nullable: true
        content:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - content
      - post
    CommentShort:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        author:
          allOf:
          - $ref: '#/components/schemas/UserPublic'
          readOnly: true
        content:
          type: string
          readOnly: true
        is_deleted:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - content
      - created_at
      - id
      - is_deleted
    Conversation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 120
        is_group:
          type: boolean
          readOnly: true
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ConversationParticipant'
          readOnly: true
        message_count:
          type: integer
          readOnly: true
        last_message:
          allOf:
          - $ref: '#/components/schemas/Message'
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_group
      - last_message
      - message_count
      - participants
      - updated_at
    ConversationParticipant:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/UserPublic'
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        joined_at:
          type: string
          format: date-time
          readOnly: true
        last_read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_muted:
          type: boolean
          readOnly: true
      required:
      - is_muted
      - joined_at
      - last_read_at
      - role
      - user
    DirectConversationRequest:
      type: object
      properties:
        recipient_username:
          type: string
          minLength: 1
          maxLength: 150
        body:
          type: string
          maxLength: 4000
      required:
      - recipient_username
    Follow:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        follower:
          allOf:
          - $ref: '#/components/schemas/UserPublic'
          readOnly: true
        following:
          allOf:
          - $ref: '#/components/schemas/UserPublic'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - follower
      - following
      - id
      - status
      - updated_at
    GroupConversationRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        usernames:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 150
          minItems: 1
      required:
      - title
      - usernames
    KindEnum:
      enum:
      - like
      - love
      - support
      type: string
      description: |-
        * `like` - Like
        * `love` - Love
        * `support` - Support
    Message:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        conversation:
          type: integer
        sender:
          allOf:
          - $ref: '#/components/schemas/UserPublic'
          readOnly: true
        body:
          type: string
          maxLength: 4000
        created_at:
          type: string
          format: date-time
          readOnly: true
        edited_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_deleted:
          type: boolean
          readOnly: true
      required:
      - body
      - conversation
      - created_at
      - edited_at
      - id
      - is_deleted
      - sender
    MessageRequest:
      type: object
      properties:
        conversation:
          type: integer
        body:
          type: string
          minLength: 1
          maxLength: 4000
      required:
      - body
      - conversation
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/UserPublic'
          readOnly: true
        verb:
