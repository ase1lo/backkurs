      required:
      - date_joined
      - first_name
      - followers_count
      - following_count
      - id
      - last_name
      - posts_count
      - profile
      - username
    VerbEnum:
      enum:
      - followed
      - follow_requested
      - liked
      - commented
      - messaged
      type: string
      description: |-
        * `followed` - Followed
        * `follow_requested` - Follow requested
        * `liked` - Liked
        * `commented` - Commented
        * `messaged` - Messaged
    VisibilityEnum:
      enum:
