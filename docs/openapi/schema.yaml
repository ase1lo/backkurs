        bio:
          type: string
          maxLength: 500
        location:
          type: string
          maxLength: 120
        website:
          type: string
          format: uri
          maxLength: 200
        avatar_url:
          type: string
          format: uri
          maxLength: 200
        birth_date:
          type: string
          format: date
