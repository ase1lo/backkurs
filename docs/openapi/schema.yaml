          type: string
          format: date-time
          readOnly: true
          title: Дата регистрации
      required:
      - date_joined
      - id
      - profile
      - username
    UserPublic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Имя пользователя
          description: Обязательное поле. Не более 150 символов. Только буквы, цифры
            и символы @/./+/-/_.
        first_name:
          type: string
          readOnly: true
          title: Имя
        last_name:
          type: string
          readOnly: true
          title: Фамилия
        profile:
          allOf:
          - $ref: '#/components/schemas/Profile'
          readOnly: true
        followers_count:
          type: integer
          readOnly: true
        following_count:
          type: integer
          readOnly: true
