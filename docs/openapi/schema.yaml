          readOnly: true
          nullable: true
        message:
          type: integer
          readOnly: true
          nullable: true
        text:
          type: string
          readOnly: true
        is_read:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - comment
      - created_at
      - id
      - is_read
      - message
      - post
      - text
      - verb
